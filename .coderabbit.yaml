reviews:
  profile: assertive
  high_level_summary: true
  path_filters:
    - "!convex/_generated/**"
    - "!.next/**"
    - "!node_modules/**"
    - "!bun.lock"
    - "!bun.lockb"
    - "!package-lock.json"
    - "!pnpm-lock.yaml"
    - "!yarn.lock"
  path_instructions:
    - path: "convex/**/*.ts"
      instructions: >
        This is a Next.js (App Router) app on the Kiranism next-shadcn-dashboard-starter,
        using Convex as the database and Clerk for auth. Convex business logic
        (mutations/queries) is tested at the function seam with convex-test in *.test.ts
        files alongside the source — flag new mutations or queries that lack test coverage.
        Role checks (Admin/Staff) must be enforced server-side inside the Convex function
        itself, not just hidden in the UI — flag any mutation that trusts a client-supplied
        role or skips a `ctx.auth.getUserIdentity()` check.
    - path: "**/*"
      instructions: >
        Domain vocabulary (Trip, Participant, Registration, Capacity, Payment Status,
        Registration Status, Activity Log, Admin, Staff) is defined in CONTEXT.md — flag
        naming that drifts from it (e.g. "Booking" instead of "Registration"). Favor small,
        focused diffs; flag unnecessary abstractions or speculative generality.
  auto_review:
    base_branches:
      - "development"
      - "main"
